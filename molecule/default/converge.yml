---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    external_repos_epel: true
    # Cockpit optional packages are absent from the minimal test container.
    # Set at play level so it also applies to thbe.rhel when it is pulled in
    # as a meta dependency of thbe.baseline (not just the explicit include).
    cockpit_manage: false
  tasks:
    - name: "Include thbe.common"
      ansible.builtin.include_role:
        name: "thbe.common"
    - name: "Include thbe.rhel"
      ansible.builtin.include_role:
        name: "thbe.rhel"
    - name: "Include thbe.baseline"
      ansible.builtin.include_role:
        name: "thbe.baseline"
      vars:
        base_user:
          - test1
        ssh_keys:
          test1:
            - name: Test User 1
              sshkey: 'ssh-rsa AAAA...fKYffH test1@host1'
